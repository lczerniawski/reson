[package]
name = "reson"
version = "1.0.1"
edition = "2021"

[[bin]]
name = "reson"
path = "src/main.rs"

[lib]
name = "reson"
path = "src/lib.rs"

[dependencies]
sysinfo = "0.38.4"
ratatui = "0.30.0"
crossterm = "0.29"
color-eyre = "0.6"
strum = { version = "0.28", features = ["derive"] }
tokio = { version = "1.50", features = ["full"] }
